[package]
name = "litecord-backend"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[dependencies]
rand = "0.8"
serde = "1.0.228"
config = "0.15.19"
rocket = { version = "0.5.1", features = ["json"] }
dotenvy = "0.15.7"
surrealdb = { version = "2.4.1", features = ["kv-mem"] }
thiserror = "2.0.17"
argon2 = "0.5.3"
chrono = "0.4.43"
jwt = "0.16.0"
hmac = "0.12.1"
sha2 = "0.10.9"
aes-gcm = "0.10.3"
base64 = "0.22.1"
rocket_ws = "0.1.1"
serde_json = "1.0.149"
