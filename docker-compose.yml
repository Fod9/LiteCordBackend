services:

  surrealdb:
    image: surrealdb/surrealdb:v2
    command: start --log info --user root --pass root --bind 0.0.0.0:8000 file:/data/db
    user: root
    volumes:
      - surrealdb_data:/data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    user: "10001:10001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health/live | grep -q '\"ready\":true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rustfs-init:
    image: minio/mc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://rustfs:9000 rustfsadmin rustfsadmin &&
        mc mb --ignore-existing local/litecord &&
        mc anonymous set download local/litecord
      "

  backend:
    build: .
    depends_on:
      surrealdb:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      ROCKET_ADDRESS: "0.0.0.0"
      ROCKET_PORT: 8080
      ROCKET_DB_URL: surrealdb:8000
      ROCKET_DB_USER: root
      ROCKET_DB_PASSWORD: root
      ROCKET_DB_CONFIG_FILE: /app/db.surql
      ROCKET_JWT_SECRET: changeme_jwt_secret_32chars_min
      ROCKET_AES_KEY: "01234567890123456789012345678901"
      ROCKET_TOKEN_EXPIRATION_SECONDS: 3600
      ROCKET_REFRESH_TOKEN_EXPIRATION_SECONDS: 604800
      ROCKET_S3_ENDPOINT: http://rustfs:9000
      ROCKET_S3_PUBLIC_ENDPOINT: http://localhost:9000
      ROCKET_S3_BUCKET: litecord
      ROCKET_S3_ACCESS_KEY: rustfsadmin
      ROCKET_S3_SECRET_KEY: rustfsadmin
      ROCKET_CDN_BASE_URL: http://localhost:9000/litecord
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  surrealdb_data:
  rustfs_data:
